<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navbar With Hover Dropdwon</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background-color: #333;
      }
      nav {
        width: 100%;
        height: 70px;
        background-color: white;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 50px;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
      }
      /* Logo */
      .logo {
        display: flex;
        align-items: center;
      }
      .logo img {
        width: 55px;
        height: 55px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid blue;
      }
      /* Links */
      nav ul {
        display: flex;
        gap: 30px;
        list-style: none;
        align-items: center;
      }
      ul li {
        position: relative;
      }
      a {
        text-decoration: none;
        font-size: 18px;
        color: #333;
        position: relative;
        transition: color 0.3s;
      }
      a:hover {
        color: blue;
      }
      a::before {
        content: "";
        position: absolute;
        width: 0;
        height: 3px;
        background-color: blue;
        bottom: -5px;
        left: 0;
        transition: 0.3s;
      }
      a:hover::before {
        width: 100%;
      }
      /* Dropdown */
      .dropdown {
        position: relative;
      }
      .dropdown-content {
        display: none;
        position: absolute;
        top: 30px;
        left: 0;
        background-color: white;
        min-width: 160px;
        box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.2);
        border-radius: 6px;
        z-index: 10;
        overflow: hidden;
        animation: dropdownFade 0.3s ease forwards;
      }
      .dropdown-content a {
        display: block;
        padding: 12px 16px;
        font-size: 16px;
        color: #333;
      }
      /* Show Dropdown On  */
      .dropdown:hover .dropdown-content {
        display: block;
      }
      /* Animation */

      @keyframes dropdownFade {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Button */
      .btn {
        padding: 12px 20px;
        background-color: blue;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.3s ease;
        font-size: 20px;
        position: relative;
        overflow: hidden;
      }

      .btn::after {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background-color: rgba(255, 255, 255, 0.3);
        transition: 0.5s;
      }
      .btn:hover::after {
        left: 100%;
      }
      .btn:hover {
        background-color: darkblue;
        transform: scale(1.05);
      }
    </style>
  </head>
  <body>
    <nav>
      <!-- Logo -->
      <div class="logo">
        <img src="./smart_learning.jpg" alt="Logo" />
      </div>
      <!-- Links -->

      <ul>
        <li>
          <a href="#">Home</a>
        </li>
        <li class="dropdown">
          <a href="#">About</a>
          <div class="dropdown-content">
            <a href="#">Our Team</a>
            <a href="#">Our Mission</a>
            <a href="#">Our Vision</a>
          </div>
        </li>
        <li><a href="#">Project</a></li>
        <li><a href="#">Blogs</a></li>
        <li><a href="#">Contact Us</a></li>
      </ul>

      <!-- Button -->

      <button class="btn">Get Started</button>
    </nav>
  </body>
</html>
